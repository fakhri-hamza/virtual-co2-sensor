[project]
name = "vsensor"
version = "0.2.0"
description = "Virtual CO2 sensor and occupancy detection from cheap sensors, with conformal uncertainty"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
